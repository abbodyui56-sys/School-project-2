const SPN={
solar(i){const g=new T.Group();g.add(bx(2.8,.1,1.3,0x1b3a8c,0,0,0,{metalness:.8,roughness:.15,emissive:0x0a1f5c,envMapIntensity:1.5}),bx(.1,.35,.1,0x90a4ae,0,-.2,0));g.position.set([-3.3,0,3.3][i%3],4.55,[-3.9,-2.1][i/3|0]);g.rotation.x=-.3;return g},
led(i){const g=new T.Group(),xs=i?[2,6,10]:[-10,-6,-2];xs.forEach(x=>{g.add(cy(.06,.08,2.2,0x607d8b,x,1.1,4.7),sp(.22,0xfff59d,x,2.3,4.7,{emissive:0xffeb3b,emissiveIntensity:1}))});return g},
vent(){const g=new T.Group(),b=new T.Group();for(let k=0;k<4;k++){const l=bx(1.2,.05,.25,0x90caf9,0,0,0);l.position.set(Math.cos(k*1.57)*.6,0,Math.sin(k*1.57)*.6);l.rotation.y=-k*1.57;b.add(l)}b.position.y=.4;g.add(cy(.5,.6,.4,0x546e7a,0,.2,0),b);g.position.set(-7,3.3,0);g.userData.anim=()=>b.rotation.y+=.15;return g},
tank(){const g=new T.Group(),w=cy(1.1,1.1,1.6,0x2196f3,0,.9,0);g.add(cy(1.2,1.2,2.4,0xb3e5fc,0,1.2,0,{transparent:true,opacity:.35}),w,cy(.08,.08,4.2,0x1e88e5,-2.8,2.1,-1),bx(2.9,.12,.12,0x1e88e5,-1.4,4.1,-1));g.position.set(8.3,0,-4);g.userData.anim=t=>w.scale.y=1+.05*Math.sin(t*2);return g},
irr(){const g=new T.Group(),c=[];for(let k=0;k<4;k++){const x=-3+4*k,s=gm(new T.ConeGeometry(.5,1,10),MT(0x4fc3f7,{transparent:true,opacity:.45}));s.position.set(x,.8,7.5);c.push(s);g.add(cy(.05,.05,.3,0x78909c,x,.15,7.5),s)}g.userData.anim=t=>c.forEach((s,k)=>s.scale.y=1+.35*Math.sin(t*5+k));return g},
tree(i){const g=new T.Group();g.add(cy(.12,.18,1,0x6d4c41,0,.5,0),gm(new T.IcosahedronGeometry(.95,1),MT(0x2e8b57,{flatShading:true})),gm(new T.IcosahedronGeometry(.7,1),MT(0x3fa66b,{flatShading:true})));g.children[1].position.y=1.8;g.children[2].position.y=2.7;g.position.set(-4.5+(i%6)*2.8,0,6+(i/6|0)*3);g.userData.anim=t=>g.rotation.z=Math.sin(t*1.4+i)*.035;return g},
garden(i){const g=new T.Group();g.add(bx(4,.25,3,0x6d4c41,0,.13,0));for(let k=0;k<10;k++)g.add(sp(.28,k%3?0x43a047:0xf06292,(k%5)*.8-1.6,.45,(k>4?.6:-.6)));g.position.set(-10,0,5+i*4.2);return g},
bin(id){const [c,k]=BIN[id],g=new T.Group();g.add(cy(.4,.34,.9,c,0,.45,0),cy(.43,.43,.12,0x37474f,0,.95,0));g.position.set(4+k*1.3,0,3.4);return g},
rec(){const g=new T.Group(),r=gm(new T.TorusGeometry(.5,.12,8,20),MT(0x2ecc71,{emissive:0x1b8f4c}));r.position.y=2.6;g.add(bx(3,1.8,2,0x78909c,0,.9,0),bx(3.3,.2,2.3,0x2e7d32,0,1.9,0),bx(2.4,.3,.8,0x455a64,0,.2,1.4),r);g.position.set(11.5,0,3);g.userData.anim=t=>r.rotation.y=t*2;return g},
ai(){const g=new T.Group(),a=gm(new T.IcosahedronGeometry(1.1,1),MT(0x00e676,{emissive:0x00c853,emissiveIntensity:.8,transparent:true,opacity:.85})),ring=gm(new T.TorusGeometry(1.7,.06,8,40),MT(0x7fffd4,{emissive:0x7fffd4}));g.add(a,ring,new T.PointLight(0x00ff99,.8,24));g.position.set(0,8.5,-3);g.userData.anim=t=>{a.rotation.y=t;ring.rotation.x=t*.8;g.position.y=8.5+Math.sin(t*2)*.3};return g}};
const grp={};
function sync(an){const o=st().own;ITEMS.forEach(it=>{const k=o[it.id]||0,a=grp[it.id]=grp[it.id]||[];while(a.length<k){const m=BIN[it.id]?SPN.bin(it.id):SPN[it.id](a.length);items.add(m);a.push(m);if(an){m.scale.setScalar(.001);pops.push({o:m,t:0})}}while(a.length>k)items.remove(a.pop())})}
/* ---------- game logic ---------- */
function blank(){return{st:1,b:GRANT[0],own:{},stars:[],t:0,done:false,pol:85}}
function startGame(){closeM();if(G.S&&G.S.st&&!G.S.fin){S=G.S}else S=blank();enter()}
function newGame(){S=blank();G.S=null;enter()}
function enter(){$('#menu').classList.add('hide');['#hud','#bot','#snd'].forEach(s=>$(s).classList.remove('hide'));auto=false;sync(false);shop();hud();save()}
function toMenu(){closeM();S=null;sync(false);['#hud','#bot','#snd'].forEach(s=>$(s).classList.add('hide'));$('#menu').classList.remove('hide');auto=true;menuBtns()}
function menuBtns(){const has=G.S&&G.S.st&&!G.S.fin;$('#bStart').textContent=has?'متابعة اللعب':'ابدأ اللعبة';$('#bNew').classList.toggle('hide',!has)}
function shop(){$('#shop').innerHTML=ITEMS.filter(i=>i.st<=S.st).map(i=>{const k=S.own[i.id]||0;return`<button class="it" data-id="${i.id}" ${k>=i.max?'disabled':''}><b>${i.i}</b>${i.n}<br>💰${i.c} · ${k}/${i.max}</button>`}).join('')}
$('#shop').onclick=e=>{const b=e.target.closest('.it');if(b&&S&&!S.done)buy(b.dataset.id)};
function buy(id){const it=ITEMS.find(x=>x.id==id),k=S.own[id]||0;if(k>=it.max)return;
if(S.b<it.c){snd(160,.25,'square');toast('الميزانية لا تكفي ⚠️');return}
S.b-=it.c;S.own[id]=k+1;sync(true);snd(660);snd(880,.1);toast(it.i+' تم تركيب '+it.n);
if(id=='solar')unlock('sol');if(id=='tree'&&S.own.tree>=10)unlock('tr');if(S.own.bp&&S.own.bpa&&S.own.bo)unlock('bin');if(id=='ai')unlock('ai');
shop();hud();save();check()}
function hud(){const m=M(),s=STG[S.st-1];
$('#chips').innerHTML=[`💰 ${S.b}`,`⚡ طاقة نظيفة ${m.clean}%`,`💧 مياه موفرة ${m.water}%`,`🌳 ${m.trees} شجرة`,`♻️ تدوير ${m.rec}%`,`🌫️ تلوث ${m.poll}`].map(x=>`<span class="chip">${x}</span>`).join('');
$('#goal').innerHTML=`<b>المرحلة ${S.st}/5: ${s.t}</b> ${'⭐'.repeat(S.stars.filter(Boolean).length)}<br>${s.g}<div class="bar"><i style="width:${Math.round(cl(s.p(m))*100)}%"></i></div>`;
$('#gb').innerHTML='🧠 <b>العقل الأخضر:</b> '+advice(m)}
function advice(m){if(S.pol!=null&&tgt()<Math.round(S.pol))return'أنظمة التنقية تعمل، والتلوث ينخفض تدريجيًا 🌬️';const g=id=>S.own[id]||0,low=ITEMS.filter(i=>i.st<=S.st&&g(i.id)<i.max).sort((a,b)=>a.c-b.c)[0];
if(low&&S.b<low.c&&!STG[S.st-1].ok(m))return'الميزانية منخفضة. انتظر دخل الاستدامة أو اختر تطويرًا أرخص.';
switch(S.st){
case 1:if(m.clean<50)return g('solar')<4?'استهلاك الكهرباء مرتفع، ننصح بتركيب ألواح شمسية ☀️':'أضف إضاءة ذكية لتقليل الهدر 💡';break;
case 2:if(!g('tank'))return'مياه الأمطار تضيع! ركّب خزان تجميع الأمطار 🛢️';if(!g('irr'))return'مستوى رطوبة التربة منخفض، يجب تشغيل الري الذكي 💧';break;
case 3:if(m.trees<6)return`مؤشر التلوث ${m.poll}. ازرع ${6-m.trees} أشجار على الأقل 🌳`;if(m.poll>45)return'ركّب حديقة ذكية أو تهوية ذكية لخفض التلوث أكثر 🌿';break;
case 4:if(!g('bp'))return'كمية المخلفات البلاستيكية مرتفعة، ركّب سلة فرز البلاستيك 🧴';if(!g('bpa'))return'الورق يختلط بالنفايات، ركّب سلة الورق 📄';if(!g('bo'))return'المخلفات العضوية تحتاج سلة خاصة 🍃';if(m.rec<70)return'طوّر نظام إعادة التدوير بمحطة تدوير ♻️';break;
case 5:if(!g('ai'))return'حان وقت تشغيل العقل الأخضر ليدير كل الأنظمة 🧠';if(m.clean<70)return'الطاقة النظيفة أقل من 70، أضف لوحًا شمسيًا أو إضاءة ذكية';if(m.water<70)return'المياه الموفرة أقل من 70، تحقق من الخزان والري';if(m.poll>35)return'التلوث ما زال مرتفعًا، ازرع أشجارًا أو حديقة';if(m.rec<80)return'نسبة التدوير أقل من 80، أكمل السلال والمحطة'}
return'ممتاز! الأنظمة تعمل بكفاءة 🌟'}
function check(){if(S.done)return;if(STG[S.st-1].ok(M()))complete()}
function complete(){S.done=true;const stars=S.b>=500?3:S.b>=200?2:1;S.stars[S.st-1]=stars;if(stars==3)unlock('s3');
snd(523,.2);setTimeout(()=>snd(784,.3),180);save();
if(S.st==5){const m=M(),score=Math.round(S.stars.reduce((a,b)=>a+b,0)*100+S.b/4+sus(m)*3);G.best=Math.max(G.best,score);S.fin=true;unlock('fin');save();
const r=score>=1100?'مهندس بيئي خبير 🥇':score>=900?'قائد مدرسة خضراء 🥈':'حارس البيئة المبتدئ 🥉';
modal(`<h2>🏆 أنقذت المدرسة!</h2><p>النجوم: ${'⭐'.repeat(S.stars.reduce((a,b)=>a+b,0))}<br>النتيجة: <b>${score}</b> (أفضل نتيجة ${G.best})<br>الاستدامة: ${Math.round(sus(m))}%<br>التقييم: <b>${r}</b></p><button class="btn" onclick="newGame()">العب من جديد</button><br><br><button class="btn s" style="color:#0f3340;background:#e6f2ee" onclick="toMenu()">القائمة الرئيسية</button>`);return}
modal(`<h2>${'⭐'.repeat(stars)} اكتملت المرحلة ${S.st}</h2><p>${STG[S.st-1].t}: نجحت! مكافأة المرحلة القادمة: 💰${GRANT[S.st]}</p><button class="btn" onclick="nextStage()">المرحلة التالية</button>`)}
function nextStage(){closeM();S.b+=GRANT[S.st];S.st++;S.done=false;S.t=0;shop();hud();save();check()}
const EV=[{p:()=>S.own.irr||S.own.ai,tx:'💧 تسريب مياه في السباكة',d:-100,ok:'الري الذكي اكتشف التسريب مبكرًا ✅'},
{p:()=>S.own.vent||S.own.ai,tx:'🌡️ موجة حر ترفع فاتورة التبريد',d:-80,ok:'التهوية الذكية قلّلت أثر الحر ✅'},{tx:'🏆 منحة بيئية تقديرية',d:150}];
function tick(){if(!S||S.done||!$('#modal').classList.contains('hide'))return;const p0=S.pol==null?85:S.pol,d=tgt()-p0;S.pol=p0+Math.sign(d)*Math.min(Math.abs(d),Math.max(1,Math.abs(d)*.15));const m=M();S.b+=Math.round(4+sus(m)*.12);S.t++;
if(S.t%22==0&&S.st>1){const e=EV[Math.random()*3|0];if(e.p&&e.p())toast(e.ok);else{S.b=Math.max(0,S.b+e.d);toast(e.tx+' ('+(e.d>0?'+':'')+e.d+')');snd(e.d>0?740:200,.2)}}
hud();save();check()}
setInterval(tick,1000);
/* ---------- modals ---------- */
function modal(h){$('#mbx').innerHTML=h;$('#modal').classList.remove('hide')}
function closeM(){$('#modal').classList.add('hide')}
const ok='<button class="btn" onclick="closeM()">حسنًا</button>';
function howTo(){modal(`<h2>طريقة اللعب</h2><ul><li>اضغط على أزرار التطوير بالأسفل لتركيب الأنظمة، ولكل واحد تكلفة من الميزانية.</li><li>أنجز هدف كل مرحلة من المراحل الخمس.</li><li>الميزانية تزيد تدريجيًا كلما ارتفعت الاستدامة.</li><li>العقل الأخضر يقترح الخطوة التالية حسب حالة مدرستك.</li><li>اسحب لتدوير الكاميرا، واستخدم إصبعين أو عجلة الفأرة للتقريب.</li><li>وفّر ميزانيتك للحصول على 3 نجوم.</li></ul>${ok}`)}
function achv(){modal(`<h2>الإنجازات</h2><ul>${Object.keys(ACH).map(k=>`<li>${G.ach[k]?'✅':'🔒'} ${ACH[k]}</li>`).join('')}</ul><p>أفضل نتيجة: ${G.best}</p>${ok}`)}
function info(){modal(`<h2>لماذا الاستدامة؟</h2><ul><li>☀️ الألواح الشمسية تحوّل ضوء الشمس إلى كهرباء دون دخان.</li><li>💧 تجميع مياه الأمطار والري بالتنقيط يقللان استهلاك المياه العذبة.</li><li>🌳 الأشجار تظلل المكان وتخفض الحرارة وتحسّن جودة الهواء.</li><li>♻️ فرز النفايات يسهّل إعادة التدوير ويحوّل العضوي إلى سماد.</li><li>🧠 الحساسات والذكاء الاصطناعي يكتشفون الهدر ويتخذون قرارات أدق.</li></ul>${ok}`)}
/* ---------- input & loop ---------- */
const pts=new Map();let pd=0;
function bindInput(){const c=$('#c');
c.addEventListener('pointerdown',e=>{pts.set(e.pointerId,e);c.setPointerCapture(e.pointerId);auto=!S&&false;pd=0});
c.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;
if(pts.size==1)th-=(e.clientX-p.clientX)*.008;
else if(pts.size==2){const o=[...pts.values()].find(q=>q.pointerId!=e.pointerId),d=Math.hypot(e.clientX-o.clientX,e.clientY-o.clientY);if(pd)zm=Math.max(.6,Math.min(2.2,zm*d/pd));pd=d;fit()}
pts.set(e.pointerId,e)});
['pointerup','pointercancel'].forEach(t=>c.addEventListener(t,e=>{pts.delete(e.pointerId);pd=0;if(!S)auto=true}));
c.addEventListener('wheel',e=>{zm=Math.max(.6,Math.min(2.2,zm*(e.deltaY>0?.92:1.08)));fit()},{passive:true})}
const CL=new T.Color(0x9fe3ff),SM=new T.Color(0x8a7d66),SUN2=new T.Color(0xffa860),CLG=new T.Color(0x6e6a63),GC=new T.Color(0x66bb6a),GS=new T.Color(0x9a9a62);
let pv=85,clk,lastBg='';const bgc=new T.Color(),skyT=new T.Color(),TOP=new T.Color(0x3f8fe0),TOPS=new T.Color(0x6f675a);
function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.1),t=clk.elapsedTime;if(auto)th+=dt*.15;placeCam();
const m=M();pv+=(m.poll-pv)*Math.min(1,dt*1.5);const k=cl(pv/85);
bgc.copy(CL).lerp(SM,k);sc.fog.color.copy(bgc);skyT.copy(TOP).lerp(TOPS,k);const bgs='linear-gradient(#'+skyT.getHexString()+',#'+bgc.getHexString()+' 62%)';if(bgs!=lastBg){document.body.style.background=bgs;lastBg=bgs}sc.fog.near=45-k*30;sc.fog.far=110-k*50;sun.intensity=.95-k*.5;hemi.intensity=.42-k*.15;sun.color.setHex(0xfff4dd).lerp(SUN2,k);clouds.forEach(c=>{c.position.x+=dt*.6;if(c.position.x>34)c.position.x=-34;c.children.forEach(s=>s.material.color.setHex(0xffffff).lerp(CLG,k))});grass.color.copy(GC).lerp(GS,k*.8);
haze.children.forEach((h,i)=>{h.position.x+=dt*.4;if(h.position.x>28)h.position.x=-28;h.material.opacity=k*.55});
puffs.forEach(p=>{p.t=(p.t+dt*.2)%1;p.mesh.position.set(-19+p.t*14+p.o*.4,7+p.t*7,-8+p.o*.3);p.mesh.scale.setScalar((.6+p.t*2.4)*(.3+k));p.mesh.material.opacity=(1-p.t)*.6*(.15+k)});trash.scale.y=.05+(100-m.rec)/100*.95;trash.visible=m.rec<100;
pops=pops.filter(p=>{p.t+=dt*2;const x=Math.min(p.t,1)-1;p.o.scale.setScalar(Math.max(.001,1+2.7*x*x*x+1.7*x*x));return p.t<1});
items.children.forEach(c=>c.userData.anim&&c.userData.anim(t));
const wet=n('tank')&&Math.floor(t/10)%3==0||(S&&S.st==2&&Math.floor(t/10)%3==0);rain.visible=!!wet;
if(wet){for(let i=0;i<300;i++){rp[i*3+1]-=dt*12;if(rp[i*3+1]<0)rp[i*3+1]=14}rain.geometry.attributes.position.needsUpdate=true}
R.render(sc,cam)}
try{if(T){load();initScene();bindInput();sync(false);clk=new T.Clock();menuBtns();loop()}}catch(e){console.error(e);$('#menu').insertAdjacentHTML('beforeend','<p>تعذر تشغيل الرسوم ثلاثية الأبعاد على هذا الجهاز.</p>')}
</script>
</body>
